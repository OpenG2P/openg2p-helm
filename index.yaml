      built on the registry platform (staff portal API/UI, partner API, beneficiary
      portal API, celery beat/worker, db-seed, id-generator, keycloak users, IAM catalog
      registration).  This chart is published by the registry-platform and is the
      single source of truth for registry deployment. A concrete registry (NSR, farmer,
      a customer registry, ...) does NOT fork or wrap this chart — it installs it
      and supplies a small values overlay that points at its own extension images,
      hostname, registryVariant, seed image and (optionally) demo users. Everything
      variant- specific is values; the templates here are generic. '
