    dependencies:
    - alias: registry
      name: openg2p-registry
      repository: https://openg2p.github.io/openg2p-helm
      version: 0.0.0-develop.421
    description: 'OpenG2P Disability Registry — a thin, branded package over the shared
      openg2p-registry chart published by the registry platform.  A single-register
      registry of persons with disability, modelled on the SPDCI Disability Registry
      data objects (DO.DR.01 - DO.DR.10). No group or household register: the subject
      is the individual.  This chart owns no service templates. It declares openg2p-registry
      as a pinned dependency and supplies only this registry''s values overlay (variant
      identity, hostname, the images built here, seed toggles, the ID pool and the
      IAM tile name), plus the analytics jobs that are genuinely ours — the reporting
      views and the dashboard import, which are written against this registry''s schema. '
