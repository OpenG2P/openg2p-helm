    apiVersion: v2
    appVersion: 0.0.0-develop.242
    created: "2026-08-28T02:34:57.381664784Z"
    dependencies:
    - alias: registry
      name: openg2p-registry
      repository: https://openg2p.github.io/openg2p-helm
      version: 0.0.0-develop.421
    description: 'OpenG2P National Social Registry — a thin, branded package over
      the shared openg2p-registry chart published by the registry platform.  This
      chart owns NO service templates. It declares openg2p-registry as a pinned dependency
      and supplies the NSR values overlay (variant identity, hostname, the NSR-built
      images, seed toggles, id types and the IAM tile name). Every deployment, service,
      ingress, keycloak/iam wiring, the db-seed machinery and the sanity suite come
      from the openg2p-registry subchart.  It does own the ANALYTICS layer, in templates/
      — because the reporting views and dashboards are written against NSR''s schema
      and the platform has no concept of them:    analytics-jobs.yaml                reporting-views
      + dashboard-import Jobs   reporting-views-refresh.yaml       CronJob refreshing
      the materialized views   dashboard-bundle-configmap.yaml    ships nsr-dashboards.zip
      into the cluster   maps-content-configmap.yaml        maps content for G2P Insights   _maps-content.tpl                  its
      name helper   superset-service-account-secret.yaml  Hook weights order these
      above the sanity suite (25), so rebuilding the views cannot change what the
      sanity tests asserted against. '
