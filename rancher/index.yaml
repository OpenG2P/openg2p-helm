    dependencies:
    - alias: registry
      name: openg2p-registry
      repository: https://openg2p.github.io/openg2p-helm
      version: 0.0.0-develop.426
    description: 'OpenG2P Farmer Registry — a thin, branded package over the shared
      openg2p-registry chart published by the registry platform.  This chart owns
      NO service templates. It declares openg2p-registry as a pinned dependency and
      supplies the farmer values overlay (variant identity, hostname, the farmer-built
      images, seed toggles and the farmer sanity suite). Every deployment, service,
      ingress, keycloak/iam wiring and the db-seed machinery come from the openg2p-registry
      subchart.  It does own the ANALYTICS layer, in templates/ — because the reporting
      views and dashboards are written against the farmer schema and the platform
      has no concept of them:    analytics-jobs.yaml                reporting-views
      + dashboard-import Jobs   reporting-views-refresh.yaml       CronJob refreshing
      the materialized views   dashboard-bundle-configmap.yaml    ships fr-dashboards.zip
      into the cluster   maps-content-configmap.yaml        maps content for G2P Insights   _maps-content.tpl                  its
      name helper   superset-service-account-secret.yaml  Hook weights order these
      above the sanity suite (25), so rebuilding the views cannot change what the
      sanity tests asserted against. '
